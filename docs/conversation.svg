<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1466" viewBox="0 0 900 1466" font-family="DejaVu Sans, Verdana, Arial, sans-serif"><rect width="900" height="1466" fill="#ecf0f4"/><rect width="900" height="90" fill="#26466e"/><text x="40" y="42" font-size="30" font-weight="bold" fill="#ffffff">WishBot demo – film library requests</text><text x="40" y="72" font-size="18" fill="#c8d7eb">sample conversation, generated by demo.py</text><rect x="441" y="120" width="419" height="92" rx="22" fill="#d0e8ff"/><text x="461" y="150" font-size="20" font-weight="bold" fill="#3c6e3c">Anna</text><text x="461" y="186" font-size="26" fill="#191919">https://films.example/arrival</text><rect x="40" y="230" width="531" height="164" rx="22" fill="#ffffff"/><text x="60" y="260" font-size="20" font-weight="bold" fill="#2864aa">WishBot</text><text x="60" y="296" font-size="26" fill="#191919">Is this what you mean?</text><text x="60" y="332" font-size="26" fill="#191919">Arrival (2016)</text><text x="60" y="368" font-size="26" fill="#191919">Reply YES to submit or NO to cancel.</text><rect x="751" y="412" width="109" height="92" rx="22" fill="#d0e8ff"/><text x="771" y="442" font-size="20" font-weight="bold" fill="#3c6e3c">Anna</text><text x="771" y="478" font-size="26" fill="#191919">yes</text><rect x="40" y="522" width="383" height="92" rx="22" fill="#ffffff"/><text x="60" y="552" font-size="20" font-weight="bold" fill="#2864aa">WishBot</text><text x="60" y="588" font-size="26" fill="#191919">Submitted: Arrival (2016)</text><rect x="688" y="632" width="172" height="92" rx="22" fill="#d0e8ff"/><text x="708" y="662" font-size="20" font-weight="bold" fill="#3c6e3c">Piotr</text><text x="708" y="698" font-size="26" fill="#191919">inception</text><rect x="40" y="742" width="593" height="128" rx="22" fill="#ffffff"/><text x="60" y="772" font-size="20" font-weight="bold" fill="#2864aa">WishBot</text><text x="60" y="808" font-size="26" fill="#191919">'inception' is already in the library. Please</text><text x="60" y="844" font-size="26" fill="#191919">check it before requesting.</text><rect x="739" y="888" width="121" height="92" rx="22" fill="#d0e8ff"/><text x="759" y="918" font-size="20" font-weight="bold" fill="#3c6e3c">Piotr</text><text x="759" y="954" font-size="26" fill="#191919">Dune</text><rect x="40" y="998" width="531" height="164" rx="22" fill="#ffffff"/><text x="60" y="1028" font-size="20" font-weight="bold" fill="#2864aa">WishBot</text><text x="60" y="1064" font-size="26" fill="#191919">Is this what you mean?</text><text x="60" y="1100" font-size="26" fill="#191919">Dune</text><text x="60" y="1136" font-size="26" fill="#191919">Reply YES to submit or NO to cancel.</text><rect x="753" y="1180" width="107" height="92" rx="22" fill="#d0e8ff"/><text x="773" y="1210" font-size="26" font-weight="bold" fill="#3c6e3c">Piotr</text><text x="773" y="1246" font-size="26" fill="#191919">no</text><rect x="40" y="1290" width="576" height="128" rx="22" fill="#ffffff"/><text x="60" y="1320" font-size="20" font-weight="bold" fill="#2864aa">WishBot</text><text x="60" y="1356" font-size="26" fill="#191919">Cancelled. Send another title or link any</text><text x="60" y="1392" font-size="26" fill="#191919">time.</text></svg>